name: "Install"
description: "Sets up pnpm, Node.js and runs install"

runs:
  using: composite
  steps:
    - name: Read Node.js version
      id: nvmrc
      shell: bash
      run: |
        echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

    - name: Setup pnpm and Node.js
      uses: pnpm/setup@v2
      with:
        cache: true
        install: false
        runtime: node@${{ steps.nvmrc.outputs.version }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
