name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pnpm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `test:leak` is the same suite with garbage collection exposed. The reachability
        # assertions cannot run without it and skip themselves, so without this entry they would
        # never run on a pull request at all.
        script: [lint, test, test:leak, build, typecheck]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Run Script ${{ matrix.script }}
        run: pnpm ${{ matrix.script }}
